 <!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colombina AI Companion for TikTok Live</title>
    <!-- Three.js 3D кітапханасы 3D модельді көрсету үшін -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent; /* TikTok Live Studio үшін фон мөлдір болады */
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            color: white;
            max-width: 400px;
        }
        input, button {
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: none;
        }
        input {
            width: 70%;
        }
        button {
            background: #ff0050;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-box {
            font-size: 14px;
            margin-bottom: 8px;
            max-height: 80px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <h3>Colombina AI Streamer</h3>
        <div style="margin-bottom: 8px;">
            <input type="password" id="apiKey" placeholder="Gemini API кілтін енгізіңіз">
            <button onclick="saveApiKey()">Сақтау</button>
        </div>
        <div class="chat-box" id="latestChat">Соңғы хабарлама: Күтілуде...</div>
        <div class="chat-box" id="aiResponse" style="color: #ff99cc;">Жауап: Дайын</div>
    </div>

    <script>
        // --- 1. 3D СЦЕНАНЫ ҚҰРУ (Three.js арқылы Коломбинаның орнына әдемі 3D аватара/нысан) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Жарық қосу
        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // Уақытша Коломбина орнына әдемі 3D кристал/фигура (кейін .glb модельді жүктеуге болады)
        const geometry = new THREE.ConeGeometry(1, 2, 32);
        const material = new THREE.MeshStandardMaterial({ color: 0x9370DB, roughness: 0.3, metalness: 0.8 }); // Коломбинаның түсіне ұқсас күлгін/ақ
        const avatar = new THREE.Mesh(geometry, material);
        scene.add(avatar);

        camera.position.z = 5;

        // Анимация (персонаж жайлап қозғалып тұруы үшін)
        function animate() {
            requestAnimationFrame(animate);
            avatar.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        // --- 2. GEMINI API ЖӘНЕ ДАУЫСПЕН ЖАУАП БЕРУ ---
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        if (apiKey) {
            document.getElementById('apiKey').value = apiKey;
        }
         function saveApiKey() {
            apiKey = document.getElementById('apiKey').value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
            alert('API кілт сақталды!');
        }

        async function askGemini(userMessage) {
            if (!apiKey) {
                document.getElementById('aiResponse').innerText = "Қате: Gemini API кілті енгізілмеген!";
                return;
            }

            document.getElementById('latestChat').innerText = Көрермен: ${userMessage};
            document.getElementById('aiResponse').innerText = "Ойланып жатырмын...";

            const prompt = Сен TikTok лайв стримінде отырған Геншин Имлектің кейіпкері Коломбина (Colombina) есімді стримерсің. Көрермен саған мынадай хат жазды: "${userMessage}". Оған өзіңнің жұмбақ, әрі жылы мінезіңмен қазақ тілінде қысқа, стримге сай қызықты етіп жауап бер.;

            try {
                const response = await fetch(https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                const replyText = data.candidates[0].content.parts[0].text;

                document.getElementById('aiResponse').innerText = Коломбина: ${replyText};
                speakText(replyText); // Дауыспен оқу

            } catch (error) {
                console.error(error);
                document.getElementById('aiResponse').innerText = "Қате орын алды.";
            }
        }

        // Мәтінді дауысқа айналдыру (Text-to-Speech)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'kk-KZ'; // Қазақ тіліне баптау
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- 3. TIKTOK CHAT ИНТЕГРАЦИЯСЫ ---
        // Мұнда TikTok Live чатын автоматты түрде қабылдайтын логика қосылады. 
        // Мысал ретінде тестовый хабарлама жіберетін функция:
        
        function simulateIncomingChat(message) {
            askGemini(message);
        }

        // Мысал үшін 10 секундтан кейін чаттан хат келгендей етіп көруге болады:
        // setTimeout(() => simulateIncomingChat("Сәлем Коломбина! Қалың қалай?"), 5000);

    </script>
</body>
</html>
