<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colombina AI Companion</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            max-width: 400px;
        }
        input, button {
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: none;
        }
        input {
            width: 65%;
            background: #222;
            color: white;
        }
        button {
            background: #ff0050;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-box {
            font-size: 14px;
            margin-top: 8px;
            max-height: 80px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <h3>Colombina AI Streamer</h3>
        <div>
            <!-- Тікелей осы жерге API кілтіңізді жазып қоюға да болады -->
            <input type="text" id="apiKey" placeholder="Gemini API кілтін жазыңыз">
            <button id="saveBtn">Сақтау</button>
        </div>
        <div class="chat-box" id="latestChat">Соңғы хабарлама: Дайын</div>
        <div class="chat-box" id="aiResponse" style="color: #ff99cc;">Жауап: Күтілуде...</div>
    </div>

    <script>
        // 3D Анимация (Коломбина орнына әдемі айналып тұрған кристал)
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        const geometry = new THREE.ConeGeometry(1, 2, 32);
        const material = new THREE.MeshStandardMaterial({ color: 0x9370DB, roughness: 0.3, metalness: 0.8 });
        const avatar = new THREE.Mesh(geometry, material);
        scene.add(avatar);

        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            avatar.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        // Кілтті сақтау логикасы
        const apiKeyInput = document.getElementById('apiKey');
        const saveBtn = document.getElementById('saveBtn');

        let savedKey = localStorage.getItem('gemini_api_key') || '';
        if (savedKey) {
            apiKeyInput.value = savedKey;
        }

        saveBtn.addEventListener('click', () => {
            const keyVal = apiKeyInput.value.trim();
            if (keyVal) {
                localStorage.setItem('gemini_api_key', keyVal);
                alert('API кілт сәтті сақталды!');
            } else {
                alert('Бос кілтті сақтау мүмкін емес!');
            }
        });async function askGemini(userMessage) {
            const currentKey = localStorage.getItem('gemini_api_key');
            if (!currentKey) {
                document.getElementById('aiResponse').innerText = "Алдымен API кілтін енгізіп, Сақтау батырмасын басыңыз!";
                return;
            }

            document.getElementById('latestChat').innerText = Көрермен: ${userMessage};
            document.getElementById('aiResponse').innerText = "Коломбина ойлануда...";

            const prompt = Сен TikTok лайв стримінде отырған Геншин Имлектің кейіпкері Коломбина (Colombina) есімді стримерсің. Көрермен саған мынадай хат жазды: "${userMessage}". Оған өзіңнің жұмбақ мінезіңмен қазақ тілінде қысқа, стримге сай қызықты етіп жауап бер.;

            try {
                const response = await fetch(https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${currentKey}, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content) {
                    const replyText = data.candidates[0].content.parts[0].text;
                    document.getElementById('aiResponse').innerText = Коломбина: ${replyText};
                    speakText(replyText);
                } else {
                    document.getElementById('aiResponse').innerText = "API кілт қате немесе жарамсыз!";
                }
            } catch (error) {
                console.error(error);
                document.getElementById('aiResponse').innerText = "Байланыс қатесі орын алды.";
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'kk-KZ';
                window.speechSynthesis.speak(utterance);
            }
        }

        // Тест үшін 3 секундтан кейін чаттан хат келгендей етіп көруге болады:
        setTimeout(() => askGemini("Сәлем Коломбина, қалың қалай?"), 4000);
    </script>
</body>
</html>
