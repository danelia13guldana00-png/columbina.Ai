<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Columbina AI Stream</title>
<style>
body {
  margin: 0;
  background: #171421;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}
h1 { text-align: center; color: #e4c9ff; }
.container {
  max-width: 1000px;
  margin: auto;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 15px;
}
.panel {
  background: #292438;
  padding: 15px;
  border-radius: 14px;
}
video {
  width: 100%;
  border-radius: 10px;
  background: black;
}
#chat {
  height: 300px;
  overflow-y: auto;
  background: #171421;
  padding: 10px;
  border-radius: 10px;
}
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: 0;
  border-radius: 8px;
}
button {
  background: #b78be8;
  color: #171421;
  font-weight: bold;
  cursor: pointer;
}
@media(max-width:700px) {
  .container { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<h1>🌙 Columbina AI Stream</h1>
<div class="container">
  <div class="panel">
    <h3>Коломбина — LIVE</h3>
    <video id="stream" controls autoplay loop muted>
    </video>
    <p>Статус: сайт дайындалып жатыр</p>
  </div>
  <div class="panel">
    <h3>💬 Чат Коломбины</h3>
    <div id="chat">
      <p>Коломбина: Всем привет! ❤️</p>
    </div>
    <input id="message" placeholder="Напиши сообщение...">
    <button onclick="sendMessage()">Отправить</button>
  </div>
</div>
<script>
function sendMessage() {
  const input = document.getElementById("message");
  const chat = document.getElementById("chat");
  if (!input.value.trim()) return;
  const p = document.createElement("p");
  p.textContent = "Зритель: " + input.value;
  chat.appendChild(p);
  input.value = "";
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
